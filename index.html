<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Orvosi latin szószedet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500;1,700&family=Alegreya+Sans:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#16222B; --muted:#5A6A72; --line:#D3DCDC;
  --accent:#9B2335; --accent-ink:#FFFFFF; --accent-soft:#F6E4E7;
  --m:#2D4F8A; --m-soft:#E3EAF6; --f:#9B2335; --f-soft:#F6E4E7; --n:#3C6A4C; --n-soft:#E2EFE6;
  --ok:#2F7A4A; --ok-soft:#E1F1E6; --bad:#B3261E; --bad-soft:#FBE6E4; --warn:#8A6100; --warn-soft:#FBF0D4;
  --shadow:0 1px 2px rgba(22,34,43,.06),0 8px 24px rgba(22,34,43,.07);
  --serif:"Alegreya",Georgia,"Times New Roman",serif;
  --sans:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#101618; --surface:#182125; --surface-2:#1D272B; --ink:#E4EBEB; --muted:#93A4A9; --line:#2B373B;
    --accent:#E26A7D; --accent-ink:#1A0A0D; --accent-soft:#3A1E24;
    --m:#86A8E6; --m-soft:#1E2A3F; --f:#E88A99; --f-soft:#3A1E24; --n:#86C29B; --n-soft:#1C3024;
    --ok:#7CCB95; --ok-soft:#18301F; --bad:#F08A80; --bad-soft:#3A1C1A; --warn:#E6C06A; --warn-soft:#33290F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101618; --surface:#182125; --surface-2:#1D272B; --ink:#E4EBEB; --muted:#93A4A9; --line:#2B373B;
  --accent:#E26A7D; --accent-ink:#1A0A0D; --accent-soft:#3A1E24;
  --m:#86A8E6; --m-soft:#1E2A3F; --f:#E88A99; --f-soft:#3A1E24; --n:#86C29B; --n-soft:#1C3024;
  --ok:#7CCB95; --ok-soft:#18301F; --bad:#F08A80; --bad-soft:#3A1C1A; --warn:#E6C06A; --warn-soft:#33290F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 64px;display:flex;flex-direction:column;gap:20px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.88em}
.la{font-family:var(--serif);font-style:italic;font-weight:700}

/* header */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.05;margin:4px 0 4px;text-wrap:balance}
.sub{margin:0;color:var(--muted)}
.modes{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.modes button{border:0;background:none;padding:8px 14px;border-radius:7px;font-weight:700;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

/* chapters */
.chapters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;display:inline-flex;gap:8px;align-items:baseline;font-weight:500}
.chip .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.8}
.chip:disabled{opacity:.45;cursor:default}
.group{display:inline-flex;align-items:center;gap:4px;border:1px dashed var(--line);border-radius:999px;padding:3px}
.group .chip{padding:4px 10px;font-size:15px}
.group .chip.main{padding:6px 12px;font-size:17px}

/* chapter head */
.ch-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
.ch-subject{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);width:100%}
.ch-head h2{font-family:var(--serif);font-size:30px;margin:0;line-height:1.1}
.pattern{color:var(--muted);margin:0}
.pattern .mono{color:var(--ink);background:var(--surface-2);border:1px solid var(--line);padding:1px 6px;border-radius:5px}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;color:var(--muted);font-weight:500}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--surface-2);color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.4;cursor:default}
.spacer{flex:1}
label.inline{display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}

/* progress */
.prog{display:flex;gap:12px;align-items:center;font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}

/* flashcard */
.stage{perspective:1400px}
.card{display:block;width:100%;border:0;padding:0;background:none;text-align:left}
.card-inner{display:grid;transition:transform .45s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:280px;padding:24px 28px;display:flex;flex-direction:column;gap:10px}
.face.back{transform:rotateY(180deg);background:var(--surface-2)}
.face .tag{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.face .main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.big-la{font-family:var(--serif);font-style:italic;font-weight:700;font-size:clamp(38px,8vw,60px);line-height:1.05;overflow-wrap:anywhere}
.big-hu{font-family:var(--serif);font-weight:500;font-size:clamp(26px,5vw,38px);line-height:1.2;text-wrap:balance}
.dict{font-size:clamp(20px,3.6vw,26px)}
.dict .la{font-size:1.25em}
.hint{color:var(--muted);font-size:15px}
.note{font-size:15px;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 10px;align-self:flex-start}
.syn{font-size:15px;color:var(--muted)}
.tap{font-size:13px;color:var(--muted);text-align:center}
.g{display:inline-block;font-family:var(--mono);font-size:13px;font-weight:500;padding:1px 7px;border-radius:5px;font-style:normal;vertical-align:middle}
.g-m{color:var(--m);background:var(--m-soft)} .g-f{color:var(--f);background:var(--f-soft)} .g-n{color:var(--n);background:var(--n-soft)}
.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:10px}
.actions .btn{padding:12px 10px}
.kbd{font-family:var(--mono);font-size:12px;opacity:.7;font-weight:400}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:12px}
.panel h3{font-family:var(--serif);font-size:26px;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:24px;font-variant-numeric:tabular-nums}
.stats b{display:block;font-family:var(--serif);font-size:34px;line-height:1}
.stats span{color:var(--muted);font-size:14px}

/* test sheet */
.sheet{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:2.5em minmax(0,1fr) minmax(0,1.2fr);gap:8px 12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .num{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .q{font-size:18px}
.row .q .la{font-size:21px}
.row .q small{display:block;color:var(--muted);font-size:13px}
.inputs{display:flex;gap:6px;min-width:0}
.inputs input,.inputs select{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0}
.inputs input.w{flex:1}
.inputs input.gen{width:7.5em;font-family:var(--mono);font-size:15px}
.inputs select{width:4.2em}
.row .fb{grid-column:2/-1;font-size:15px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center}
.row.ok{background:var(--ok-soft)} .row.bad{background:var(--bad-soft)}
.row.ok .num::after{content:" ✓";color:var(--ok)} .row.bad .num::after{content:" ✗";color:var(--bad)}
.inputs input.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.inputs input.right,.inputs select.right{border-color:var(--ok)}
.inputs select.wrong{border-color:var(--bad);color:var(--bad)}
.fb .ans .la{font-size:18px}
.fb .why{color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:3px}
.result{display:flex;flex-wrap:wrap;gap:20px;align-items:center}
.grade{font-family:var(--serif);font-size:64px;line-height:1;font-weight:700;color:var(--accent);min-width:1ch}
.submit-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end}
.inline input[type=number]{width:4.5em;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-variant-numeric:tabular-nums}
.timer{position:sticky;top:8px;z-index:5;display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;box-shadow:var(--shadow)}
.timer .t-time{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.timer .bar i{background:var(--accent);transition:width .25s linear}
.timer.low .t-time{color:var(--warn)} .timer.low .bar i{background:var(--warn)}
.timer.up .t-time{color:var(--bad)}

/* list */
.search{flex:1;min-width:180px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{text-align:left;padding:8px 14px;border-top:1px solid var(--line);vertical-align:baseline}
thead th{border-top:0;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
tr.sec td{background:var(--surface-2);font-family:var(--serif);font-weight:700;font-size:18px}
tr.sec td small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:14px;margin-left:8px}
td.lat{white-space:nowrap}
td.lat .la{font-size:19px}
td.sc{font-family:var(--mono);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
td.sc .o{color:var(--ok)} td.sc .x{color:var(--bad)}
.foot{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:space-between;border-top:1px solid var(--line);padding-top:12px}

@media (max-width:640px){
  .row{grid-template-columns:2em minmax(0,1fr)}
  .row .inputs,.row .fb{grid-column:2/-1}
  .face{padding:20px;min-height:250px}
  .actions .kbd{display:none}
  .modes{width:100%}
  td.lat{white-space:normal}
  th,td{padding:8px 10px}
  .modes button{flex:1;padding:8px 6px}
}
@media (prefers-reduced-motion:reduce){
  .card-inner,.bar i{transition:none}
}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">Orvosi latin</div>
      <h1>Főnevek declinatiók szerint</h1>
      <p class="sub">1–2. szószedet · <span id="totalCount"></span> szó szótári alakkal</p>
    </div>
    <nav class="modes" role="tablist" aria-label="Tanulási mód">
      <button role="tab" id="tab-cards" data-mode="cards">Kártyák</button>
      <button role="tab" id="tab-test" data-mode="test">Szódolgozat</button>
      <button role="tab" id="tab-list" data-mode="list">Szójegyzék</button>
    </nav>
  </header>

  <div class="chapters" id="chapters" aria-label="Fejezet"></div>

  <div class="ch-head">
    <div class="ch-subject">Orvosi latin</div>
    <h2 id="chTitle"></h2>
    <p class="pattern" id="chPattern"></p>
  </div>

  <!-- KÁRTYÁK -->
  <section id="mode-cards" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="toolbar">
        <div class="seg" id="cardDir" aria-label="Irány">
          <button data-v="la">Latin → magyar</button><button data-v="hu">Magyar → latin</button><button data-v="mix">Vegyes</button>
        </div>
        <span class="spacer"></span>
        <button class="btn" id="cardRestart">Újrakeverés</button>
      </div>
      <div class="prog"><span id="cardProgText"></span><div class="bar"><i id="cardBar"></i></div><span id="cardAgain"></span></div>
      <div id="cardArea">
        <div class="stage">
          <button class="card" id="card" aria-label="Kártya megfordítása">
            <div class="card-inner">
              <div class="face front" id="cardFront"></div>
              <div class="face back" id="cardBack"></div>
            </div>
          </button>
        </div>
        <div class="actions" style="margin-top:14px">
          <button class="btn bad" id="btnNo" disabled>✗ Még nem <span class="kbd">←</span></button>
          <button class="btn" id="btnFlip">Megfordít <span class="kbd">szóköz</span></button>
          <button class="btn ok" id="btnYes" disabled>✓ Tudtam <span class="kbd">→</span></button>
        </div>
      </div>
      <div class="panel" id="cardDone" hidden></div>
    </div>
  </section>

  <!-- SZÓDOLGOZAT -->
  <section id="mode-test" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="toolbar">
        <div class="seg" id="testDir" aria-label="Irány">
          <button data-v="la">Latin → magyar</button><button data-v="hu">Magyar → latin</button>
        </div>
        <label class="inline" for="testCount">Szavak:
          <select id="testCount"><option value="10">10</option><option value="20">20</option><option value="30">30</option><option value="0">mind</option></select>
        </label>
        <label class="inline" id="fullWrap" for="testFull"><input type="checkbox" id="testFull"> teljes szótári alak (genitivus + nem)</label>
        <label class="inline" for="testTime">Időkorlát: <input type="number" id="testTime" min="0" max="180" step="1" inputmode="numeric"> perc</label>
        <span class="spacer"></span>
        <button class="btn" id="testNew">Új dolgozat</button>
      </div>
      <div class="timer" id="timer" role="timer" hidden><span class="t-time" id="timerText">00:00</span><div class="bar"><i id="timerBar"></i></div><span class="hint" id="timerHint"></span></div>
      <div class="panel" id="testResult" hidden></div>
      <ol class="sheet" id="sheet"></ol>
      <div class="submit-row">
        <button class="btn primary" id="testSubmit">Beadom</button>
      </div>
    </div>
  </section>

  <!-- SZÓJEGYZÉK -->
  <section id="mode-list" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="toolbar">
        <input class="search" id="search" type="search" placeholder="Keresés latinul vagy magyarul…" aria-label="Keresés">
        <span class="hint" id="listCount"></span>
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr><th>Szótári alak</th><th>Jelentés</th><th>Eredmény</th></tr></thead>
          <tbody id="listBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <div class="foot">
    <span>Az eredményeid ebben a böngészőben maradnak meg.</span>
    <button class="linkbtn" id="resetStats">Eredmények törlése</button>
  </div>
</div>

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const chap=id=>CHAPTERS.find(c=>c.id===id)||CHAPTERS[0];
const chapterWords=()=>WORDS.filter(chap(state.chapter).filter);
const gTag=g=>`<span class="g g-${g}" title="${G_NAME[g]}">${g}</span>`;
const dictForm=w=>`<span class="la">${esc(w.la)}</span>, <span class="mono">${esc(w.gen)}</span> ${gTag(w.g)}`;
const stripAcc=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
function nhu(s){ return s.toLowerCase().normalize("NFC").replace(/\(ti\.\s*izom\)/g,"").replace(/[.!?;]+$/,"").replace(/\s+/g," ").trim(); }
function alts(meaning){
  const t=meaning.replace(/\(ti\.\s*izom\)/gi,"");
  const set=new Set([nhu(t), nhu(t.replace(/\d\.\s*/g," "))]);
  t.split(/\s*\d\.\s*/).forEach(p=>p.split(/[,:]/).forEach(x=>{
    x=x.trim(); if(!x)return;
    set.add(nhu(x.replace(/\([^)]*\)/g,""))); set.add(nhu(x.replace(/[()]/g,"")));
  }));
  set.delete(""); return [...set];
}
WORDS.forEach(w=>{ w.alts=alts(w.hu); w.hunorm=nhu(w.hu); });
WORDS.forEach(w=>{ w.same=WORDS.filter(o=>o!==w && o.hunorm===w.hunorm); });
function lev(a,b){
  if(Math.abs(a.length-b.length)>1) return 2;
  const d=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){ let prev=d[0]; d[0]=i;
    for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=t; } }
  return d[b.length];
}
function huLabel(w){ return `${DECL_NAME[w.d]} declinatio`; }

/* ---------- chapters UI ---------- */
function renderChapters(){
  const el=$("#chapters"); let html="";
  const chipHtml=c=>{
    const n=WORDS.filter(c.filter).length;
    const dis=(c.id==="hard"&&n===0)?" disabled":"";
    return `<button class="chip${c.group?" main":""}" data-ch="${c.id}" aria-pressed="${state.chapter===c.id}"${dis}>${esc(c.label)} <span class="n">${n}</span></button>`;
  };
  CHAPTERS.forEach(c=>{
    if(c.sub) return;
    if(c.group){ html+=`<span class="group">${chipHtml(c)}${CHAPTERS.filter(x=>x.sub).map(chipHtml).join("")}</span>`; }
    else html+=chipHtml(c);
  });
  el.innerHTML=html;
  const c=chap(state.chapter);
  $("#chTitle").textContent=c.title;
  $("#chPattern").innerHTML=c.pattern()+` · <span style="font-variant-numeric:tabular-nums">${chapterWords().length} szó</span>`;
}
$("#chapters").addEventListener("click",e=>{
  const b=e.target.closest("[data-ch]"); if(!b||b.disabled) return;
  state.chapter=b.dataset.ch; persist(); renderChapters(); startMode();
});

/* ---------- modes ---------- */
function setMode(m){
  state.mode=m; persist(); stopTimer();
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
  ["cards","test","list"].forEach(x=>$("#mode-"+x).hidden=(x!==m));
  startMode();
}
document.querySelectorAll("[data-mode]").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.mode)));
function startMode(){
  if(chapterWords().length===0 && state.chapter==="hard"){ state.chapter="all"; renderChapters(); }
  if(state.mode==="cards") startCards();
  else if(state.mode==="test") newTest();
  else renderList();
}
function segInit(id,key,onChange){
  const el=$(id);
  const sync=()=>el.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===state[key]));
  el.addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b)return; state[key]=b.dataset.v; persist(); sync(); onChange(); });
  sync();
}

/* ---------- flashcards ---------- */
let cs={queue:[],total:0,done:0,firstOk:0,again:0,cur:null,flipped:false,missed:new Set()};
function startCards(list){
  const words=list||chapterWords();
  cs={queue:shuffle(words).map(w=>({w,dir:state.cardDir==="mix"?(Math.random()<.5?"la":"hu"):state.cardDir,tries:0})),
      total:words.length,done:0,firstOk:0,again:0,cur:null,flipped:false,missed:new Set()};
  $("#cardArea").hidden=false; $("#cardDone").hidden=true;
  nextCard();
}
function nextCard(){
  cs.cur=cs.queue.shift()||null; cs.flipped=false;
  $("#card").classList.remove("flipped");
  if(!cs.cur){ finishCards(); return; }
  const {w,dir}=cs.cur;
  const note=w.note?`<div class="note">${esc(w.note)}</div>`:"";
  const same=w.same.length?`<div class="syn">Ugyanez a jelentése: ${w.same.map(dictForm).join("; ")}</div>`:"";
  if(dir==="la"){
    $("#cardFront").innerHTML=`<div class="tag"><span>latin → magyar</span><span>${huLabel(w)}</span></div>
      <div class="main"><div class="big-la">${esc(w.la)}</div><div class="hint">Mit jelent? Mi a genitivusa és a neme?</div></div><div class="tap">Koppints a megfordításhoz</div>`;
    $("#cardBack").innerHTML=`<div class="tag"><span>jelentés</span><span>${huLabel(w)}</span></div>
      <div class="main"><div class="dict">${dictForm(w)}</div><div class="big-hu">${esc(w.hu)}</div>${note}</div>`;
  } else {
    const dupHint=w.same.length?`<div class="hint">Több helyes latin szó is van rá.</div>`:"";
    $("#cardFront").innerHTML=`<div class="tag"><span>magyar → latin</span><span>${huLabel(w)}</span></div>
      <div class="main"><div class="big-hu">${esc(w.hu)}</div>${dupHint}</div><div class="tap">Koppints a megfordításhoz</div>`;
    $("#cardBack").innerHTML=`<div class="tag"><span>szótári alak</span><span>${huLabel(w)} · ${G_NAME[w.g]}</span></div>
      <div class="main"><div class="big-la">${esc(w.la)}</div><div class="dict">${dictForm(w)}</div>${note}${same}</div>`;
  }
  $("#btnYes").disabled=$("#btnNo").disabled=true;
  updateCardProg();
}
function flip(){
  if(!cs.cur) return;
  cs.flipped=!cs.flipped; $("#card").classList.toggle("flipped",cs.flipped);
  if(cs.flipped){ $("#btnYes").disabled=$("#btnNo").disabled=false; }
}
function answerCard(ok){
  if(!cs.cur||!cs.flipped) return;
  record(cs.cur.w,ok);
  if(ok){ cs.done++; if(cs.cur.tries===0) cs.firstOk++; }
  else { cs.cur.tries++; cs.again++; cs.missed.add(cs.cur.w); cs.queue.splice(Math.min(cs.queue.length,4),0,cs.cur); }
  renderChapters(); nextCard();
}
function updateCardProg(){
  $("#cardProgText").textContent=`${cs.done} / ${cs.total}`;
  $("#cardBar").style.width=(cs.total?cs.done/cs.total*100:0)+"%";
  const rep=cs.queue.filter(q=>q.tries>0).length+(cs.cur&&cs.cur.tries>0?1:0);
  $("#cardAgain").textContent=rep?`${rep} ismétlésre vár`:"";
}
function finishCards(){
  updateCardProg();
  $("#cardArea").hidden=true;
  const d=$("#cardDone"); d.hidden=false;
  const missed=[...cs.missed];
  d.innerHTML=`<h3>Kész a pakli</h3>
    <div class="stats"><div><b>${cs.total}</b><span>kártya</span></div><div><b>${cs.firstOk}</b><span>elsőre tudtad</span></div><div><b>${cs.again}</b><span>ismétlés kellett</span></div></div>
    ${missed.length?`<p class="hint">Nehezebb szavak: ${missed.map(w=>`<span class="la">${esc(w.la)}</span>`).join(", ")}</p>`:`<p class="hint">Minden szót elsőre tudtál.</p>`}
    <div class="toolbar"><button class="btn primary" id="cdAgain">Újra az egész</button>${missed.length?`<button class="btn" id="cdMissed">Csak a nehezek (${missed.length})</button>`:""}<button class="btn" id="cdTest">Szódolgozat ebből</button></div>`;
  $("#cdAgain").onclick=()=>startCards();
  if(missed.length) $("#cdMissed").onclick=()=>startCards(missed);
  $("#cdTest").onclick=()=>setMode("test");
}
$("#card").addEventListener("click",flip);
$("#btnFlip").addEventListener("click",flip);
$("#btnYes").addEventListener("click",()=>answerCard(true));
$("#btnNo").addEventListener("click",()=>answerCard(false));
$("#cardRestart").addEventListener("click",()=>startCards());
document.addEventListener("keydown",e=>{
  if(state.mode!=="cards"||e.target.matches("input,select,textarea")) return;
  if(e.key===" "||e.key==="Enter"){ if(e.target.closest("button")) return; e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight"){ answerCard(true); }
  else if(e.key==="ArrowLeft"){ answerCard(false); }
});

/* ---------- szódolgozat ---------- */
let ts={items:[],graded:false};
function syncTestControls(){
  $("#testCount").value=state.testCount;
  $("#testFull").checked=state.testFull;
  $("#testTime").value=state.testTime;
  $("#fullWrap").style.display=state.testDir==="hu"?"":"none";
}
function newTest(list){
  syncTestControls();
  let words=list||shuffle(chapterWords());
  const n=+state.testCount; if(!list && n>0) words=words.slice(0,n);
  ts={items:words.map(w=>({w,dir:state.testDir,full:state.testDir==="hu"&&state.testFull,res:null,override:false})),graded:false};
  $("#testResult").hidden=true;
  $("#testSubmit").hidden=false;
  resetTimer();
  renderSheet();
  const first=$("#sheet input"); if(first&&state.mode==="test") first.focus({preventScroll:true});
}
function renderSheet(){
  $("#sheet").innerHTML=ts.items.map((it,i)=>{
    const w=it.w;
    let q, inp;
    if(it.dir==="la"){
      q=`<span class="la">${esc(w.la)}</span>`;
      inp=`<input class="w" id="a${i}-w" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="jelentés" aria-label="${esc(w.la)} jelentése">`;
    } else {
      q=`${esc(w.hu)}<small>${huLabel(w)}${w.same.length?" · több jó válasz is van":""}</small>`;
      inp=`<input class="w" id="a${i}-w" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="latin szó" aria-label="${esc(w.hu)} latinul">`;
      if(it.full) inp+=`<input class="gen" id="a${i}-g" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="gen." aria-label="genitivus végződés">
        <select id="a${i}-n" aria-label="nem"><option value="">nem</option><option>m</option><option>f</option><option>n</option></select>`;
    }
    return `<li class="row" id="r${i}"><span class="num">${i+1}.</span><div class="q">${q}</div><div class="inputs">${inp}</div><div class="fb" id="fb${i}" hidden></div></li>`;
  }).join("");
}
$("#sheet").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!e.target.matches("input,select")) return;
  e.preventDefault();
  const all=[...document.querySelectorAll("#sheet input,#sheet select")];
  const k=all.indexOf(e.target);
  if(k<all.length-1) all[k+1].focus(); else $("#testSubmit").focus();
});
function gradeHU(ans,w){
  const a=nhu(ans);
  if(!a) return {ok:false,why:"üresen hagytad"};
  if(w.alts.includes(a)) return {ok:true};
  const pieces=a.split(/\s*[,;\/]\s*|\s+és\s+/).filter(Boolean);
  let notes=new Set(), hits=0;
  for(const p of pieces){
    if(w.alts.includes(p)){hits++;continue;}
    const sp=stripAcc(p);
    if(w.alts.some(x=>stripAcc(x)===sp)){hits++;notes.add("figyelj az ékezetekre");continue;}
    if(sp.length>=5 && w.alts.some(x=>lev(stripAcc(x),sp)<=1)){hits++;notes.add("kis elírás");continue;}
  }
  if(hits===pieces.length) return {ok:true,why:[...notes].join(", ")};
  if(hits>0) return {ok:false,why:"részben jó"};
  return {ok:false};
}
function matchGen(u,w){
  u=u.toLowerCase().replace(/[\s\-–]/g,""); const exp=w.gen.replace(/-/g,"");
  if(!u) return false;
  if(u===exp) return true;
  if(u.length>=3 && exp.endsWith(u)) return true;
  if(u.endsWith(exp) && u.slice(0,2)===w.la.slice(0,2)) return true;
  return false;
}
function gradeLA(it,i){
  const w=it.w; const inp=$(`#a${i}-w`); const u=inp.value.trim().toLowerCase();
  const out={ok:false,parts:{}};
  if(!u){ out.why="üresen hagytad"; out.parts.w=false; if(it.full){out.parts.g=false;out.parts.n=false;} return out; }
  let target=null, why="";
  if(u===w.la) target=w;
  else {
    const same=w.same.find(o=>o.la===u);
    if(same) target=same;
    else {
      const wAlt=new Set(w.alts);
      const near=WORDS.find(o=>o!==w && o.la===u && o.alts.some(x=>wAlt.has(x)));
      if(near){ target=near; why=`elfogadva, de a várt szó: ${w.la}`; }
    }
  }
  if(!target){
    out.parts.w=false;
    if(lev(u,w.la)===1) out.why="majdnem: egy betű eltér";
    if(it.full){ out.parts.g=matchGen($(`#a${i}-g`).value,w); out.parts.n=$(`#a${i}-n`).value===w.g; }
    return out;
  }
  out.parts.w=true; out.target=target;
  if(it.full){
    out.parts.g=matchGen($(`#a${i}-g`).value,target);
    out.parts.n=$(`#a${i}-n`).value===target.g;
    const miss=[]; if(!out.parts.g) miss.push("genitivus"); if(!out.parts.n) miss.push("nem");
    if(miss.length) why=(why?why+"; ":"")+"hibás: "+miss.join(" és ");
  }
  out.ok=Object.values(out.parts).every(Boolean);
  out.why=why; return out;
}
function submitTest(){
  if(ts.graded) return;
  ts.items.forEach((it,i)=>{
    const w=it.w;
    it.res = it.dir==="la" ? gradeHU($(`#a${i}-w`).value,w) : gradeLA(it,i);
    record(w,it.res.ok);
  });
  ts.graded=true;
  if(tm.end){ stopTimer(); $("#timerHint").textContent=Date.now()<tm.end?"Beadva.":"Lejárt az idő – automatikusan beadva."; }
  else $("#timer").hidden=true;
  ts.items.forEach((it,i)=>paintRow(i));
  $("#testSubmit").hidden=true;
  showResult();
  renderChapters();
}
function paintRow(i){
  const it=ts.items[i], w=it.w, r=it.res, ok=r.ok||it.override;
  const row=$("#r"+i); row.classList.toggle("ok",ok); row.classList.toggle("bad",!ok);
  row.querySelectorAll("input,select").forEach(x=>x.disabled=true);
  const wi=$(`#a${i}-w`);
  const filled=x=>!!x.value.trim();
  if(it.dir==="la"){ wi.classList.toggle("wrong",!ok&&filled(wi)); wi.classList.toggle("right",ok); }
  else {
    wi.classList.toggle("wrong",!r.parts.w&&!it.override&&filled(wi)); wi.classList.toggle("right",!!r.parts.w);
    if(it.full){
      $(`#a${i}-g`).classList.toggle("wrong",!r.parts.g&&!it.override&&filled($(`#a${i}-g`))); $(`#a${i}-g`).classList.toggle("right",!!r.parts.g);
      $(`#a${i}-n`).classList.toggle("wrong",!r.parts.n&&!it.override); $(`#a${i}-n`).classList.toggle("right",!!r.parts.n);
    }
  }
  const fb=$("#fb"+i); fb.hidden=false;
  const ans = it.dir==="la" ? `<span class="ans">${esc(w.hu)}</span> <span class="why">· ${dictForm(w)}</span>` : `<span class="ans">${dictForm(w)}</span>`;
  const why = it.override ? `<span class="why">elfogadtad</span>` : (r.why?`<span class="why">${esc(r.why)}</span>`:"");
  const note = w.note?`<span class="why">${esc(w.note)}</span>`:"";
  const btn = (!r.ok && !it.override) ? `<button class="linkbtn" data-accept="${i}">Elfogadom, jó volt</button>` : "";
  fb.innerHTML = (ok && !r.why && !it.override && it.dir==="la") ? `<span class="why">${dictForm(w)}</span>` : `${ans}${why}${note}${btn}`;
}
$("#sheet").addEventListener("click",e=>{
  const b=e.target.closest("[data-accept]"); if(!b) return;
  const i=+b.dataset.accept; ts.items[i].override=true; unrecordBad(ts.items[i].w);
  paintRow(i); showResult(); renderChapters();
});
function jegy(p){ return p>=0.9?5:p>=0.8?4:p>=0.65?3:p>=0.5?2:1; }
function showResult(){
  const n=ts.items.length, good=ts.items.filter(it=>it.res.ok||it.override).length;
  const wrong=ts.items.filter(it=>!(it.res.ok||it.override)).map(it=>it.w);
  const p=n?good/n:0;
  const el=$("#testResult"); el.hidden=false;
  el.innerHTML=`<div class="result"><div class="grade" aria-label="jegy">${jegy(p)}</div>
    <div class="stats"><div><b>${good} / ${n}</b><span>helyes válasz</span></div><div><b>${Math.round(p*100)}%</b><span>eredmény</span></div></div></div>
    <p class="hint" style="margin:0">A jegy csak tájékoztató: 90% felett 5, 80% felett 4, 65% felett 3, 50% felett 2.</p>
    <div class="toolbar">${wrong.length?`<button class="btn primary" id="trWrong">Hibásak újra (${wrong.length})</button>`:""}<button class="btn${wrong.length?"":" primary"}" id="trNew">Új dolgozat</button><button class="btn" id="trCards">Hibásak kártyán</button></div>`;
  if(wrong.length) $("#trWrong").onclick=()=>{ newTest(shuffle(wrong)); window.scrollTo({top:$("#mode-test").offsetTop-10}); };
  $("#trNew").onclick=()=>{ newTest(); window.scrollTo({top:$("#mode-test").offsetTop-10}); };
  const tc=$("#trCards"); tc.hidden=!wrong.length; tc.onclick=()=>{ setModeWith("cards",wrong); };
}
function setModeWith(m,list){
  state.mode=m; persist();
  document.querySelectorAll("[data-mode]").forEach(b=>b.setAttribute("aria-selected",b.dataset.mode===m));
  ["cards","test","list"].forEach(x=>$("#mode-"+x).hidden=(x!==m));
  startCards(list);
}
$("#testSubmit").addEventListener("click",submitTest);
$("#testNew").addEventListener("click",()=>newTest());
$("#testCount").addEventListener("change",e=>{ state.testCount=e.target.value; persist(); newTest(); });
$("#testFull").addEventListener("change",e=>{ state.testFull=e.target.checked; persist(); newTest(); });
$("#testTime").addEventListener("change",e=>{
  const v=Math.min(180,Math.max(0,Math.round(+e.target.value)||0));
  state.testTime=String(v); e.target.value=v; persist(); if(!ts.graded) resetTimer();
});
$("#sheet").addEventListener("input",startTimer);

/* időkorlát: az első beírással indul, lejártakor automatikusan bead */
let tm={total:0,end:0,id:0};
function stopTimer(){ clearInterval(tm.id); tm.id=0; }
function resetTimer(){
  stopTimer(); tm={total:+state.testTime*60000,end:0,id:0};
  const el=$("#timer"); el.hidden=!tm.total; el.classList.remove("low","up");
  $("#timerHint").textContent="Az első beírással indul";
  if(tm.total) paintTimer(tm.total);
}
function startTimer(){
  if(!tm.total||tm.end||ts.graded) return;
  tm.end=Date.now()+tm.total; $("#timerHint").textContent="";
  tm.id=setInterval(tickTimer,250);
}
function tickTimer(){
  const left=Math.max(0,tm.end-Date.now()); paintTimer(left);
  if(left<=0){ $("#timer").classList.add("up"); submitTest(); }
}
function paintTimer(left){
  const s=Math.ceil(left/1000);
  $("#timerText").textContent=`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;
  $("#timerBar").style.width=(left/tm.total*100)+"%";
  $("#timer").classList.toggle("low",left>0&&left<=Math.min(60000,tm.total*.2));
}

/* ---------- szójegyzék ---------- */
function renderList(){
  const q=stripAcc(($("#search").value||"").trim().toLowerCase());
  const words=chapterWords().filter(w=>!q||stripAcc(w.la).includes(q)||stripAcc(w.hu.toLowerCase()).includes(q));
  let html="", lastSec=null;
  for(const w of words){
    const sec = state.chapter==="all"||state.chapter==="hard" ? w.d : null;
    if(sec!==null && sec!==lastSec){
      const c=CHAPTERS.find(c=>c.id==="d"+sec);
      html+=`<tr class="sec"><td colspan="3">${SUBJECT} · ${c.title}<small>${c.pattern()}</small></td></tr>`;
      lastSec=sec;
    }
    const s=stats[w.key];
    const sc=s?`<span class="o">✓${s.ok}</span> <span class="x">✗${s.bad}</span>`:`<span style="opacity:.5">–</span>`;
    html+=`<tr><td class="lat">${dictForm(w)}</td><td>${esc(w.hu)}${w.note?`<div class="hint">${esc(w.note)}</div>`:""}</td><td class="sc">${sc}</td></tr>`;
  }
  $("#listBody").innerHTML=html||`<tr><td colspan="3" class="hint">Nincs találat.</td></tr>`;
  $("#listCount").textContent=`${words.length} szó`;
}
$("#search").addEventListener("input",renderList);

/* ---------- reset ---------- */
let resetArmed=false;
$("#resetStats").addEventListener("click",e=>{
  if(!resetArmed){ resetArmed=true; e.target.textContent="Biztosan? Kattints újra"; setTimeout(()=>{resetArmed=false;e.target.textContent="Eredmények törlése";},4000); return; }
  stats={}; saveStats(); resetArmed=false; e.target.textContent="Törölve";
  if(state.chapter==="hard") state.chapter="all";
  renderChapters(); if(state.mode==="list") renderList();
});

/* ---------- init ---------- */
$("#totalCount").textContent=WORDS.length;
segInit("#cardDir","cardDir",()=>startCards());
segInit("#testDir","testDir",()=>newTest());
renderChapters();
setMode(state.mode);
</script>
